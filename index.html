<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — RMRP Юрист</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #333; }
        h2, h3 { margin-top: 0; color: #f5f5f5; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { background: #2563eb; border: none; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
        .btn-sm { padding: 6px 10px; font-size: 13px; width: auto; margin: 4px 4px 0 0; }
        .btn-red { background: #dc2626; }
        .btn-orange { background: #d97706; }
        .btn-green { background: #16a34a; }
        .key-box { background: #0f172a; border: 1px dashed #3b82f6; padding: 14px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-top: 10px; color: #60a5fa; }
        .item { border-bottom: 1px solid #333; padding: 12px 0; }
        .item:last-child { border-bottom: none; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .bg-wait { background: #374151; color: #d1d5db; }
        .bg-active { background: #065f46; color: #6ee7b7; }
        .bg-ban { background: #7f1d1d; color: #fca5a5; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="login-screen" class="card">
        <h2>Вход в панель управления</h2>
        <input type="password" id="admin-pass" placeholder="Введите пароль админа">
        <button onclick="checkPass()">Войти</button>
    </div>

    <div id="main-screen" class="hidden">
        <div class="card">
            <h3>Создать новый ключ</h3>
            <input type="text" id="note" placeholder="Ник / Telegram покупателя">
            <select id="days">
                <option value="7">7 дней</option>
                <option value="30" selected>30 дней (1 месяц)</option>
                <option value="90">90 дней (3 месяца)</option>
                <option value="3650">Навсегда (10 лет)</option>
            </select>
            <button onclick="createKey()">Сгенерировать ключ</button>
            <div id="new-key-area" class="hidden">
                <div class="key-box" id="generated-key"></div>
                <button class="btn-green" style="margin-top:8px;" onclick="copyKey()">Скопировать ключ</button>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;">Выданные ключи</h3>
                <button class="btn-sm" onclick="loadKeys()">Обновить</button>
            </div>
            <div id="keys-list">Загрузка...</div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_zxEzT7COe0uFc-WNIY0Qxg_Fmi5x-tO";
    const ADMIN_PASSWORD = "RMRP2026";

    const headers = {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
    };

    if (sessionStorage.getItem("auth") === "1") showMain();

    function checkPass() {
        if (document.getElementById("admin-pass").value === ADMIN_PASSWORD) {
            sessionStorage.setItem("auth", "1");
            showMain();
        } else {
            alert("Неверный пароль!");
        }
    }

    function showMain() {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("main-screen").classList.remove("hidden");
        loadKeys();
    }

    function makeCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let part1 = "", part2 = "";
        for (let i = 0; i < 4; i++) {
            part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            part2 += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return `RMRP-${part1}-${part2}`;
    }

    async function createKey() {
        const note = document.getElementById("note").value.trim() || "Без заметки";
        const days = parseInt(document.getElementById("days").value);
        const key_code = makeCode();

        const res = await fetch(`${SUPABASE_URL}/rest/v1/license_keys`, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({ key_code, note, days })
        });

        if (res.ok) {
            document.getElementById("generated-key").innerText = key_code;
            document.getElementById("new-key-area").classList.remove("hidden");
            document.getElementById("note").value = "";
            loadKeys();
        } else {
            const err = await res.text();
            alert("Ошибка базы: " + err);
        }
    }

    function copyKey() {
        const text = document.getElementById("generated-key").innerText;
        navigator.clipboard.writeText(text);
        alert("Ключ скопирован: " + text);
    }

    async function loadKeys() {
        const list = document.getElementById("keys-list");
        const res = await fetch(`${SUPABASE_URL}/rest/v1/license_keys?select=*&order=created_at.desc`, { headers });
        const data = await res.json();

        if (!Array.isArray(data) || !data.length) {
            list.innerHTML = "<p style='color:#888;'>Ключей пока нет</p>";
            return;
        }

        list.innerHTML = data.map(k => {
            let status = `<span class="badge bg-wait">Ожидает активации (${k.days} дн.)</span>`;
            if (k.is_banned) {
                status = `<span class="badge bg-ban">ЗАБАНЕН</span>`;
            } else if (k.expires_at) {
                const exp = new Date(k.expires_at);
                const isExp = exp < new Date();
                status = isExp 
                    ? `<span class="badge bg-ban">Истек (${exp.toLocaleDateString()})</span>`
                    : `<span class="badge bg-active">Активен до ${exp.toLocaleDateString()}</span>`;
            }

            return `
                <div class="item">
                    <div style="font-weight:bold; font-size:16px; color:#93c5fd;">${k.key_code}</div>
                    <div style="font-size:14px; color:#ccc; margin:4px 0;">Покупатель: <b>${k.note}</b></div>
                    <div>${status} ${k.device_id ? '📱 Привязан' : ''}</div>
                    <div style="margin-top:6px;">
                        ${k.device_id ? `<button class="btn-sm btn-orange" onclick="resetDevice('${k.key_code}')">Сбросить тел.</button>` : ''}
                        <button class="btn-sm ${k.is_banned ? 'btn-green' : 'btn-red'}" onclick="toggleBan('${k.key_code}', ${!k.is_banned})">
                            ${k.is_banned ? 'Разбанить' : 'Бан'}
                        </button>
                        <button class="btn-sm btn-red" onclick="delKey('${k.key_code}')">Удалить</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    async function resetDevice(code) {
        await fetch(`${SUPABASE_URL}/rest/v1/license_keys?key_code=eq.${code}`, {
            method: "PATCH", headers, body: JSON.stringify({ device_id: null })
        });
        loadKeys();
    }

    async function toggleBan(code, banState) {
        await fetch(`${SUPABASE_URL}/rest/v1/license_keys?key_code=eq.${code}`, {
            method: "PATCH", headers, body: JSON.stringify({ is_banned: banState })
        });
        loadKeys();
    }

    async function delKey(code) {
        if (!confirm("Удалить ключ навсегда?")) return;
        await fetch(`${SUPABASE_URL}/rest/v1/license_keys?key_code=eq.${code}`, {
            method: "DELETE", headers
        });
        loadKeys();
    }
</script>
</body>
</html>
